[package]
name = "envoy-acme-dynmod"
version = "0.2.0"
edition = "2024"

[dependencies]
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", tag = "v1.39.0" }
dashmap = "6.2.1"
instant-acme = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_valid = "2.0.3"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
x509-parser = "0.18.1"

[features]
default = []
envoy_1_37 = []


[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = false
