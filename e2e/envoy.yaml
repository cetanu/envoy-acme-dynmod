node:
  id: envoy-acme-e2e
  cluster: envoy-acme-e2e

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: http
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "envoy-acme-http\n"
                http_filters:
                  - name: envoy.extensions.filters.http.dynamic_modules
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: envoy_acme_dynmod
                        do_not_close: true
                      filter_name: envoy_acme
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: >-
                          {
                            "domains":["acme.test"],
                            "contact_email":"admin@acme.test",
                            "storage_path":"/var/lib/envoy-acme",
                            "certificate_delivery":"file",
                            "acme_directory_url":"https://pebble:14000/dir",
                            "renew_before_days":30,
                            "check_interval_seconds":5
                          }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
