[package]
name = "envoy-acme-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
